services:
  - type: web
    name: pc-shop
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase: { name: pc-shop-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: pc-shop-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: pc-shop-db, property: database }
      - key: DB_USER
        fromDatabase: { name: pc-shop-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: pc-shop-db, property: password }
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  - name: pc-shop-db
    plan: free
    region: frankfurt
    databaseName: pcshop
    user: pcshop
