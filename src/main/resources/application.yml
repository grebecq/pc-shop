spring:
  application:
    name: pc-shop
  config:
    import: optional:file:.env[.properties][encoding=utf-8]
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:pcshop}?currentSchema=${DB_SCHEMA:public}}
    username: ${DB_USER:pcshop}
    password: ${DB_PASSWORD:pcshop}
  flyway:
    schemas: ${DB_SCHEMA:public}
  docker:
    compose:
      file: docker-compose.yml
      start:
        arguments: [db, mailpit]
        skip: never
      lifecycle-management: start-only
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.starttls.enable: true
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

springdoc:
  packages-to-scan: dev.pcshop.controller.api
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 14d
      cookie:
        http-only: true
        same-site: lax

shop:
  orders:
    payment-timeout: ${PAYMENT_TIMEOUT:30m}
  base-url: ${SHOP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
  metrika-id: ${YANDEX_METRIKA_ID:}
  delivery:
    courier-price: 490
    free-from: 50000
  yookassa:
    shop-id: ${YOOKASSA_SHOP_ID:}
    secret-key: ${YOOKASSA_SECRET_KEY:}
    api-url: https://api.yookassa.ru/v3
  mail:
    from: "${MAIL_FROM:Сборка <noreply@pc-shop.local>}"
  admin:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:}
  telegram:
    bot-token: ${BOT_TOKEN:}
    bot-username: ${BOT_USERNAME:}
    admin-chat-id: ${ADMIN_CHAT_ID:}
    payment-token: ${TELEGRAM_PAYMENT_TOKEN:}
