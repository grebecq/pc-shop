spring:
  application:
    name: pc-shop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pcshop}
    username: ${DB_USER:pcshop}
    password: ${DB_PASSWORD:pcshop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

shop:
  # Публичный адрес сайта: нужен для ссылок в сообщениях бота
  base-url: ${SHOP_BASE_URL:http://localhost:8080}
  admin:
    username: ${ADMIN_USER:admin}
    password: ${ADMIN_PASSWORD:admin}
  telegram:
    # Пустой токен = бот выключен, сайт и API работают без него
    bot-token: ${BOT_TOKEN:}
    # Имя бота без @ — для кнопки «Открыть бота» на сайте
    bot-username: ${BOT_USERNAME:}
    admin-chat-id: ${ADMIN_CHAT_ID:}
    # Токен платёжного провайдера из @BotFather (Payments). Пусто = демо-оплата кнопкой
    payment-token: ${TELEGRAM_PAYMENT_TOKEN:}
