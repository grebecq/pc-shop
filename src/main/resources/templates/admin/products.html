<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head('Товары')}"></head>
<body>
<header th:replace="~{admin/layout :: nav}"></header>
<main class="wrap">
    <h1>Товары</h1>
    <div th:replace="~{admin/layout :: flash}"></div>
    <div class="table-scroll">
        <table class="cart-table admin-table">
            <thead><tr><th>Товар</th><th>Категория</th><th>Цена, ₽</th><th>Остаток</th><th>Продаётся</th><th></th></tr></thead>
            <tbody>
            <tr th:each="p : ${products}" th:id="'p' + ${p.id}" th:classappend="${!p.active} ? 'is-muted'">
                <td><a th:href="@{/p/{s}(s=${p.slug})}" target="_blank" th:text="${p.name}">Товар</a></td>
                <td th:text="${p.category.name}">Категория</td>
                <td><input class="cell-input" type="number" min="1" name="price" th:value="${p.price}" th:form="'f' + ${p.id}" aria-label="Цена"></td>
                <td><input class="cell-input cell-input--short" type="number" min="0" name="stock" th:value="${p.stock}" th:form="'f' + ${p.id}" aria-label="Остаток"></td>
                <td><input type="checkbox" name="active" value="true" th:checked="${p.active}" th:form="'f' + ${p.id}" aria-label="Продаётся"></td>
                <td>
                    <form th:id="'f' + ${p.id}" method="post" th:action="@{/admin/products/{id}(id=${p.id})}">
                        <button class="btn btn--small btn--ghost" type="submit">Сохранить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
