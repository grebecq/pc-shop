<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Админка'">Админка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
</head>
<header th:fragment="nav" class="header header--admin">
    <div class="wrap header__inner">
        <a class="logo" th:href="@{/admin}"><span class="logo__mark"></span>Сборка · админка</a>
        <nav class="header__nav">
            <a th:href="@{/admin/orders}">Заказы</a>
            <a th:href="@{/admin/products}">Товары</a>
            <a th:href="@{/admin/settings}">Настройки</a>
            <a th:href="@{/}" target="_blank">Открыть сайт ↗</a>
        </nav>
    </div>
</header>
<div th:fragment="flash">
    <p class="notice" th:if="${message}" th:text="${message}">Сохранено</p>
    <p class="notice notice--error" th:if="${error}" th:text="${error}">Ошибка</p>
</div>
</body>
</html>
