<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="head" class="account-head">
    <div>
        <h1>Личный кабинет</h1>
        <p class="muted" th:text="${user.username}">email</p>
    </div>
    <form method="post" th:action="@{/logout}">
        <button class="btn btn--ghost btn--small" type="submit">Выйти</button>
    </form>
</div>

<form th:fragment="email-reminder(from)" th:if="${account != null and !account.emailConfirmed}"
      class="notice notice--warn email-reminder" method="post" th:action="@{/account/email}">
    <span>Подтвердите почту <b th:text="${account.email}">email</b>: мы отправили на неё ссылку. Так письма о заказах
        и ссылка для смены пароля точно до вас дойдут.</span>
    <input type="hidden" name="from" th:value="${from}">
    <button class="btn btn--small btn--ghost" type="submit">Отправить ещё раз</button>
</form>

<th:block th:fragment="address-fields">
    <div class="field-row">
        <div class="field">
            <label for="label">Название</label>
            <input id="label" th:field="*{label}" maxlength="64" placeholder="Дом, Работа" list="address-labels">
            <datalist id="address-labels"><option value="Дом"><option value="Работа"><option value="Дача"></datalist>
            <p class="form-error" th:errors="*{label}"></p>
        </div>
        <div class="field">
            <label for="city">Город</label>
            <input id="city" th:field="*{city}" maxlength="128" autocomplete="address-level2" placeholder="Москва">
            <p class="form-error" th:errors="*{city}"></p>
        </div>
    </div>
    <div class="field">
        <label for="street">Улица и дом</label>
        <input id="street" th:field="*{street}" maxlength="256" autocomplete="address-line1" placeholder="Тверская ул., 7">
        <p class="form-error" th:errors="*{street}"></p>
    </div>
    <div class="field-row">
        <div class="field">
            <label for="apartment">Квартира, офис</label>
            <input id="apartment" th:field="*{apartment}" maxlength="32" autocomplete="address-line2">
        </div>
        <div class="field">
            <label for="postalCode">Почтовый индекс</label>
            <input id="postalCode" th:field="*{postalCode}" inputmode="numeric" maxlength="6" autocomplete="postal-code" placeholder="Необязательно">
            <p class="form-error" th:errors="*{postalCode}"></p>
        </div>
    </div>
    <label class="check"><input type="checkbox" th:field="*{makeDefault}"> Подставлять этот адрес при оформлении заказа</label>
</th:block>
</body>
</html>
