<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Новый пароль')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="wrap auth">
    <div class="panel auth__form" th:if="${expired}">
        <h1>Ссылка не работает</h1>
        <p class="notice notice--error">Ссылка устарела, запросите новую.</p>
        <p class="muted">Ссылка из письма действует 30 минут и срабатывает один раз. Новое письмо отменяет прежние ссылки.</p>
        <a class="btn btn--wide" th:href="@{/password/forgot}">Запросить новую ссылку</a>
    </div>

    <form class="panel auth__form" th:unless="${expired}" method="post" th:action="@{/password/reset}"
          th:object="${form}" novalidate>
        <h1>Новый пароль</h1>
        <p class="muted">Придумайте новый пароль для входа. Старый перестанет работать.</p>
        <input type="hidden" th:field="*{token}">
        <label for="password">Новый пароль</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" autofocus>
        <p class="hint">Не короче 8 символов.</p>
        <p class="form-error" th:errors="*{password}"></p>
        <label for="confirm">Повторите пароль</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8">
        <p class="form-error" th:errors="*{confirm}"></p>
        <p class="form-error" th:errors="*{confirmed}"></p>
        <button class="btn btn--wide" type="submit">Сохранить пароль</button>
    </form>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
