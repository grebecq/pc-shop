<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Корзина')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="wrap">
    <h1>Корзина</h1>

    <p class="empty" data-cart-empty hidden>Корзина пуста. <a th:href="@{/}">Перейти в каталог</a></p>

    <div class="checkout" data-cart-full hidden>
        <section>
            <table class="cart-table">
                <thead><tr><th>Товар</th><th>Цена</th><th>Количество</th><th>Сумма</th><th></th></tr></thead>
                <tbody data-cart-rows></tbody>
            </table>
            <p class="cart-total">Итого: <b data-cart-total>0 ₽</b></p>
        </section>

        <form class="panel order-form" data-order-form novalidate
              th:attr="data-logged-in=${user != null}">
            <h2 class="h3">Оформление</h2>
            <p class="muted small-top" th:if="${user == null}">
                <a th:href="@{/login(next='/cart')}">Войдите</a>, чтобы подставить сохранённые адреса, или оформите без регистрации.
            </p>

            <fieldset class="group">
                <legend>Получатель</legend>
                <label for="name">Имя</label>
                <input id="name" name="name" autocomplete="name" required maxlength="128" th:value="${account?.name}">
                <label for="phone">Телефон</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" required placeholder="+7 900 000-00-00" th:value="${account?.phone}">
            </fieldset>

            <fieldset class="group">
                <legend>Доставка</legend>
                <th:block th:if="${addresses != null and !addresses.empty}">
                    <label class="choice" th:each="a, it : ${addresses}">
                        <input type="radio" name="addressId" th:value="${a.id}" th:checked="${it.first}">
                        <span><b th:text="${a.label}">Дом</b><br><span class="muted" th:text="${a.oneLine()}">адрес</span></span>
                    </label>
                    <label class="choice">
                        <input type="radio" name="addressId" value="">
                        <span><b>Другой адрес</b></span>
                    </label>
                </th:block>
                <div class="new-address" data-new-address th:hidden="${addresses != null and !addresses.empty}">
                    <label for="city">Город</label>
                    <input id="city" name="city" autocomplete="address-level2" maxlength="128" placeholder="Москва">
                    <label for="street">Улица и дом</label>
                    <input id="street" name="street" autocomplete="address-line1" maxlength="256" placeholder="Тверская ул., 7">
                    <label for="apartment">Квартира, офис</label>
                    <input id="apartment" name="apartment" autocomplete="address-line2" maxlength="32">
                    <label class="check" th:if="${user != null}"><input type="checkbox" name="saveAddress" checked> Сохранить адрес в кабинете</label>
                </div>
            </fieldset>

            <label for="comment">Комментарий к заказу</label>
            <textarea id="comment" name="comment" rows="2" maxlength="1000" placeholder="Например, позвонить за час"></textarea>
            <button class="btn btn--wide" type="submit">Перейти к оплате</button>
            <p class="form-error" data-order-error role="alert"></p>
        </form>
    </div>
</main>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
