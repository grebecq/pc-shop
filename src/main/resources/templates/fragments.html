<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Общий <head>: title передаётся параметром -->
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Сборка'">Сборка</title>
    <meta name="description" content="Демо-магазин комплектующих для ПК: сайт, Telegram-бот и админка на Spring Boot.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/shop.css}">
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
    <!-- CSRF-токен для запросов из JS (оформление заказа) -->
    <meta name="csrf-token" th:if="${_csrf}" th:content="${_csrf.token}">
    <meta name="csrf-header" th:if="${_csrf}" th:content="${_csrf.headerName}">
</head>

<div th:fragment="header">
    <header class="header">
        <div class="wrap header__inner">
            <a class="logo" th:href="@{/}"><span class="logo__mark"></span>Сборка</a>
            <form class="search" role="search" method="get" th:action="@{/search}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
                <input type="search" name="q" th:value="${q}" placeholder="Поиск: RTX 5070, Ryzen 7, DDR5…" aria-label="Поиск по каталогу" maxlength="100">
            </form>
            <a class="btn btn--small header__build" th:href="@{/configurator}">Собрать ПК</a>
            <a class="header__link" th:if="${user == null}" th:href="@{/login}">Войти</a>
            <a class="header__link" th:if="${user != null}" th:href="@{/account}" th:text="${user.displayName}">Кабинет</a>
            <a class="header__cart" th:href="@{/cart}">Корзина <span class="badge" data-cart-count hidden>0</span></a>
        </div>
        <div class="header__cats"><nav class="wrap header__nav" aria-label="Категории">
            <a class="header__nav-build" th:href="@{/configurator}" th:classappend="${builderPage} ? 'is-current'">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="11" height="18" rx="1.5"/><path d="M7.5 7h4M7.5 10h4"/><circle cx="9.5" cy="16" r="1.6"/><path d="M18 8v8M15.5 12h5"/></svg>
                Сборка ПК</a>
            <a th:each="c : ${categories}" th:href="@{/c/{s}(s=${c.slug})}" th:text="${c.name}"
               th:classappend="${category != null and category.slug == c.slug} ? 'is-current'">Категория</a>
        </nav></div>
    </header>
</div>

<footer th:fragment="footer" class="footer">
    <div class="wrap footer__inner">
        <span>© 2026 «Сборка» — комплектующие и сборка ПК с проверкой совместимости</span>
        <nav class="footer__links"><a th:href="@{/configurator}">Собрать ПК</a> <a th:href="@{/cart}">Корзина</a> <a th:href="@{/account}">Личный кабинет</a></nav>
    </div>
    <script th:src="@{/js/cart.js}"></script>
</footer>

<!-- Иконка категории вместо фотографии товара -->
<svg th:fragment="icon(slug)" class="icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" th:switch="${slug}">
    <g th:case="'cpu'"><rect x="13" y="13" width="22" height="22" rx="2"/><rect x="19" y="19" width="10" height="10"/><path d="M18 8v5M24 8v5M30 8v5M18 35v5M24 35v5M30 35v5M8 18h5M8 24h5M8 30h5M35 18h5M35 24h5M35 30h5"/></g>
    <g th:case="'motherboard'"><rect x="8" y="8" width="32" height="32" rx="2"/><rect x="13" y="13" width="10" height="10"/><path d="M28 13h7M28 17h7M28 21h7M13 30h22M13 35h14"/></g>
    <g th:case="'ram'"><rect x="5" y="16" width="38" height="13" rx="1.5"/><path d="M10 20h4v5h-4zM17 20h4v5h-4zM24 20h4v5h-4zM31 20h4v5h-4zM9 29v4M14 29v4M19 29v4M29 29v4M34 29v4M39 29v4"/></g>
    <g th:case="'gpu'"><rect x="5" y="14" width="36" height="20" rx="2"/><circle cx="17" cy="24" r="6"/><circle cx="31" cy="24" r="6"/><path d="M41 18h2M41 30h2M9 34v4h12v-4"/></g>
    <g th:case="'ssd'"><rect x="5" y="18" width="38" height="12" rx="1.5"/><rect x="9" y="21" width="8" height="6"/><rect x="20" y="21" width="8" height="6"/><path d="M33 22v4M37 22v4"/></g>
    <g th:case="'psu'"><rect x="7" y="11" width="34" height="26" rx="2"/><circle cx="21" cy="24" r="8"/><path d="M21 16v16M13 24h16M35 17v4M35 29h0"/></g>
    <g th:case="'cooler'"><circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="3"/><path d="M24 21c-2-5-1-9 3-11M27 24c5-2 9-1 11 3M24 27c2 5 1 9-3 11M21 24c-5 2-9 1-11-3"/></g>
    <g th:case="*"><rect x="14" y="6" width="20" height="36" rx="2"/><circle cx="24" cy="14" r="2"/><path d="M19 22h10M19 26h10M19 30h10"/></g>
</svg>

<!-- Меню личного кабинета -->
<nav th:fragment="account-tabs(tab)" class="tabs" aria-label="Личный кабинет">
    <a th:href="@{/account}" th:classappend="${tab == 'orders'} ? 'is-current'">Мои заказы</a>
    <a th:href="@{/account/builds}" th:classappend="${tab == 'builds'} ? 'is-current'">Мои сборки</a>
    <a th:href="@{/account/addresses}" th:classappend="${tab == 'addresses'} ? 'is-current'">Адреса доставки</a>
    <a th:href="@{/account/profile}" th:classappend="${tab == 'profile'} ? 'is-current'">Профиль</a>
</nav>

<!-- Сообщения после действий -->
<div th:fragment="flash">
    <p class="notice" th:if="${message}" th:text="${message}">Сохранено</p>
    <p class="notice notice--error" th:if="${error}" th:text="${error}">Ошибка</p>
</div>

<!-- Фото товара или значок категории. Обёртке с фото нужен класс has-photo.
     Фото лежат на сайтах производителей: если картинка не загрузилась, убираем её и показываем значок -->
<th:block th:fragment="photo(p)">
    <img th:if="${p.imageUrl != null}" th:src="${p.imageUrl}" th:alt="${p.name}" loading="lazy"
         referrerpolicy="no-referrer" onerror="this.parentElement.classList.remove('has-photo'); this.remove()">
    <svg th:replace="~{fragments :: icon(${p.category.slug})}"></svg>
</th:block>

<!-- Карточка товара в сетке -->
<article th:fragment="card(p)" class="card">
    <a class="card__media" th:href="@{/p/{s}(s=${p.slug})}" th:classappend="${p.imageUrl != null} ? 'has-photo'">
        <th:block th:replace="~{fragments :: photo(${p})}"></th:block>
    </a>
    <div class="card__body">
        <a class="card__title" th:href="@{/p/{s}(s=${p.slug})}" th:text="${p.name}">Название</a>
        <p class="card__specs" th:text="${@fmt.specs(p)}">AM5 · 6 · 12</p>
        <div class="card__foot">
            <span class="price" th:text="${@fmt.rub(p.price)}">0 ₽</span>
            <button th:if="${p.inStock()}" class="btn btn--small" type="button"
                    th:attr="data-add-to-cart=${p.id}">В корзину</button>
            <span th:unless="${p.inStock()}" class="muted">Нет в наличии</span>
        </div>
    </div>
</article>

</body>
</html>
