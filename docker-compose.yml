services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pcshop
      POSTGRES_USER: pcshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pcshop}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcshop"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/pcshop
      DB_USER: pcshop
      DB_PASSWORD: ${DB_PASSWORD:-pcshop}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
