services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pcshop
      POSTGRES_USER: pcshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pcshop}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcshop"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://db:5432/pcshop
      DB_USER: pcshop
      DB_PASSWORD: ${DB_PASSWORD:-pcshop}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

volumes:
  db-data:
